<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FRCSS校隊點名系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 text-slate-800 pb-24">

  <div class="max-w-md mx-auto bg-white rounded-2xl shadow-lg p-5 space-y-4 relative">

    <!-- 頁頭與日期選擇 -->
    <div class="flex justify-between items-center border-b pb-3">
      <div>
        <h1 class="text-xl font-bold text-slate-800">FRCSS校隊點名系統</h1>
        <div class="flex items-center gap-1.5 mt-1 text-xs text-slate-600">
          <label for="attendanceDate" class="font-bold text-slate-700">📅 日期：</label>
          <input type="date" id="attendanceDate" onchange="onDateChange()" class="border border-slate-300 rounded-lg px-2 py-0.5 text-xs font-bold text-slate-800 bg-slate-50 focus:ring-2 focus:ring-blue-500 focus:outline-none cursor-pointer">
        </div>
      </div>
      <button type="button" onclick="openAdminModal()" class="bg-slate-700 hover:bg-slate-800 text-white text-xs font-bold px-3 py-2 rounded-xl transition active:scale-95 shadow-sm">
        ⚙️ 名單管理
      </button>
      <!-- 📊 歷史紀錄按鈕 -->
      <button type="button" onclick="openHistoryModal()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium flex items-center gap-1 shadow-sm transition">
        📊 歷史紀錄
      </button>
    </div>

    <!-- 📌 隊伍獨立點名提交狀態指示列 -->
    <div id="statusBanner" class="p-3 rounded-xl text-xs font-bold flex items-center justify-between transition-all bg-amber-50 text-amber-800 border border-amber-200">
      <div class="flex items-center gap-1.5">
        <span id="statusIcon">⚠️</span>
        <span id="statusText">請先選擇隊伍 / 組別</span>
      </div>
      <span id="statusTime" class="text-[11px] font-normal text-slate-500">當日可隨時更新</span>
    </div>

    <!-- 點名者身份輸入 (必填) -->
    <div class="bg-blue-50/50 p-3 rounded-xl border border-blue-100">
      <label class="block text-xs font-bold text-blue-900 mb-1">👤 點名者姓名 / 身份 <span class="text-red-500">* (必填)</span></label>
      <input type="text" id="updatedBy" placeholder="例如：王老師 / 田徑隊隊長" class="w-full p-2.5 border border-blue-300 rounded-xl bg-white text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
    </div>

    <!-- 🎯 隊伍 / 組別選擇選單 -->
    <div>
      <label class="block text-xs font-semibold text-slate-600 mb-1">🎯 選擇隊伍 / 組別 <span class="text-red-500">*</span></label>
      <select id="groupFilter" onchange="filterAndRenderList()" class="w-full p-2.5 border border-slate-300 bg-slate-50 rounded-xl text-sm font-bold text-slate-800 focus:ring-2 focus:ring-blue-500 focus:outline-none cursor-pointer">
        <option value="">-- 👈 請先選擇隊伍 / 組別 --</option>
      </select>
    </div>

    <!-- 🔍 搜尋列 -->
    <div>
      <input type="text" id="searchInput" oninput="filterAndRenderList()" placeholder="🔍 搜尋姓名、班別、社..." class="w-full p-2.5 border border-slate-200 rounded-xl bg-slate-100 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
    </div>

    <!-- 📊 統計與快捷操作按鈕區 -->
    <div class="pt-1 border-t space-y-2">
      <div class="flex justify-between items-center text-xs">
        <span id="statsText" class="font-bold text-slate-700">請先選擇隊伍</span>
        <button type="button" onclick="loadAttendance()" class="text-blue-600 font-bold hover:underline text-xs">🔄 重新整理</button>
      </div>

      <!-- ⚡ 全選 / 全不選 / 重置 按鈕組 -->
      <div class="grid grid-cols-3 gap-2">
        <button type="button" onclick="markAllInGroup('Present')" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-300 text-xs font-bold py-2 px-1 rounded-xl transition active:scale-95 flex items-center justify-center gap-1 shadow-sm">
          <span>✓</span>
          <span>全選 (出席)</span>
        </button>

        <button type="button" onclick="markAllInGroup('ABS')" class="bg-rose-50 hover:bg-rose-100 text-rose-800 border border-rose-300 text-xs font-bold py-2 px-1 rounded-xl transition active:scale-95 flex items-center justify-center gap-1 shadow-sm">
          <span>✗</span>
          <span>全不選 (缺席)</span>
        </button>

        <button type="button" onclick="markAllInGroup('')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 text-xs font-bold py-2 px-1 rounded-xl transition active:scale-95 flex items-center justify-center gap-1 shadow-sm" title="重置本隊點名並同步清空 Google Sheet 紀錄">
          <span>↺</span>
          <span>重置點名</span>
        </button>
      </div>
    </div>

    <!-- 載入中動畫 -->
    <div id="loading" class="hidden text-center py-8 text-slate-500">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent mb-2"></div>
      <p class="text-sm font-medium">正在讀取點名資料...</p>
    </div>

    <!-- 點名列表區域 -->
    <div id="memberList" class="space-y-2.5 max-h-[38vh] overflow-y-auto pr-1"></div>

    <!-- 🚀 確認完成點名 按鈕 -->
    <div class="pt-2">
      <button type="button" id="confirmBtn" onclick="confirmAttendanceSubmission()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow-lg hover:shadow-xl transition active:scale-[0.98] flex items-center justify-center gap-2 text-base">
        <span>🚀</span>
        <span id="confirmBtnText">確認完成點名 (提交至 Google)</span>
      </button>
    </div>

    <!-- 實時 Log 對話框 -->
    <div class="border-t pt-3 mt-4">
      <p class="text-[11px] font-bold text-slate-500 mb-1">🐞 系統狀態 Log：</p>
      <div id="debugLog" class="bg-slate-900 text-green-400 font-mono text-[10px] p-2.5 rounded-xl h-20 overflow-y-auto whitespace-pre-wrap shadow-inner"></div>
    </div>

  </div>

  <!-- 後台彈出視窗 -->
  <div id="adminModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-md w-full p-5 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b pb-2">
        <h2 class="text-base font-bold text-slate-800">⚙️ 管理員選單</h2>
        <button type="button" onclick="closeAdminModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold px-2">&times;</button>
      </div>

      <!-- 密碼驗證區 -->
      <div id="pwdArea" class="space-y-3">
        <input type="password" id="adminPwd" onkeyup="if(event.key==='Enter') checkPwd()" placeholder="請輸入管理密碼" class="w-full p-2.5 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button type="button" onclick="checkPwd()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl text-xs transition">解鎖進入</button>
      </div>

      <!-- 管理功能區 -->
      <div id="adminTools" class="hidden space-y-3">
        <div class="p-3 bg-slate-50 border rounded-xl space-y-2">
          <p class="text-xs font-bold text-slate-700">1. 下載 CSV 範本（學校格式）</p>
          <button type="button" onclick="downloadCSVTemplate()" class="w-full bg-slate-700 hover:bg-slate-800 text-white py-2 rounded-lg text-xs font-bold transition">📥 下載 CSV 範本</button>
        </div>

        <div class="p-3 bg-blue-50 border border-blue-200 rounded-xl space-y-2">
          <p class="text-xs font-bold text-blue-900">2. 上傳 CSV 名單</p>
          <p class="text-[11px] text-slate-500">學校匯出檔另存為「CSV UTF-8」後直接上傳；系統按標題名稱讀取 Group、班別、班號、性別、社、姓名。</p>
          <input type="file" id="csvFile" accept=".csv" class="w-full text-xs text-slate-500">
          <button type="button" id="uploadBtn" onclick="uploadCSVFile()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-lg text-xs font-bold transition">🚀 開始上傳匯入</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 📊 歷史紀錄 Modal (彈出視窗) -->
  <div id="historyModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">

      <!-- 1. Modal 標題 -->
      <div class="px-6 py-4 bg-slate-800 text-white flex justify-between items-center">
        <h3 class="text-lg font-bold flex items-center gap-2">📊 出席歷史與統計查詢</h3>
        <button type="button" onclick="closeHistoryModal()" class="text-slate-400 hover:text-white text-xl">&times;</button>
      </div>

      <!-- 2. 篩選控制列 -->
      <div class="p-4 bg-slate-50 border-b border-slate-200 grid grid-cols-1 md:grid-cols-3 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">組別/隊伍</label>
          <select id="histGroup" onchange="fetchHistory()" class="w-full border border-slate-300 rounded-lg p-2 text-sm bg-white">
            <option value="">全部組別</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">搜尋學生 / 班別</label>
          <input type="text" id="histSearch" oninput="fetchHistory()" placeholder="輸入姓名或班別..." class="w-full border border-slate-300 rounded-lg p-2 text-sm bg-white">
        </div>
        <div class="flex items-end">
          <button type="button" onclick="fetchHistory()" class="w-full bg-slate-700 text-white rounded-lg p-2 text-sm font-medium hover:bg-slate-800 transition">
            🔄 重新整理
          </button>
        </div>
      </div>

      <!-- 3. 統計數據卡片 (已移除遲到) -->
      <div class="p-4 bg-white grid grid-cols-3 gap-3 text-center border-b border-slate-100">
        <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
          <div class="text-xs text-slate-500">總點名人次</div>
          <div id="statTotal" class="text-lg font-bold text-slate-700">0</div>
        </div>
        <div class="bg-emerald-50 p-2.5 rounded-xl border border-emerald-100">
          <div class="text-xs text-emerald-600">出席率</div>
          <div id="statRate" class="text-lg font-bold text-emerald-700">0%</div>
        </div>
        <div class="bg-rose-50 p-2.5 rounded-xl border border-rose-100">
          <div class="text-xs text-rose-600">缺席</div>
          <div id="statAbsent" class="text-lg font-bold text-rose-700">0</div>
        </div>
      </div>

      <!-- 4. 歷史明細列表 -->
      <div class="p-4 overflow-y-auto flex-1">
        <div id="histLoading" class="text-center py-8 text-slate-400 hidden">⏳ 載入歷史紀錄中...</div>
        <div id="histList" class="space-y-2"></div>
      </div>

    </div>
  </div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwoCp0bHW5wiH9a1cwLxGW-Ypk_ooXUrPCAFI-fbF7xhml4e_H8j37LvX5_ZPXgAKx0kQ/exec";

    let currentData = [];

    function log(msg) {
      const logDiv = document.getElementById('debugLog');
      if (logDiv) {
        const time = new Date().toLocaleTimeString();
        logDiv.innerHTML += `[${time}] ${msg}\n`;
        logDiv.scrollTop = logDiv.scrollHeight;
      }
    }

    // 1. 取得當前選取的日期 (使用本地時間，避免 UTC 時區導致日期錯誤)
    function getSelectedDate() {
      const dateInput = document.getElementById('attendanceDate');
      if (dateInput && dateInput.value) {
        return dateInput.value;
      }
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    // 2. 系統啟動初始化
    window.onload = function() {
      log("✅ 系統啟動...");
      const todayStr = getSelectedDate();
      const dateInput = document.getElementById('attendanceDate');
      if (dateInput) {
        dateInput.value = todayStr;
      }
      loadAttendance();
    };

    function onDateChange() {
      const currentDate = getSelectedDate();
      log(`📅 切換點名日期至：${currentDate}`);
      loadAttendance();
    }

    function validateUpdatedBy() {
      const updatedByEl = document.getElementById('updatedBy');
      const updatedBy = updatedByEl ? updatedByEl.value.trim() : '';
      if (!updatedBy) {
        alert("⚠️ 請先在上方輸入「點名者姓名 / 身份」，才可進行點名操作！");
        if (updatedByEl) updatedByEl.focus();
        return null;
      }
      return updatedBy;
    }

    function checkGroupSubmissionStatus(selectedGroup) {
      const banner = document.getElementById('statusBanner');
      const icon = document.getElementById('statusIcon');
      const text = document.getElementById('statusText');
      const btnText = document.getElementById('confirmBtnText');
      const currentDate = getSelectedDate();

      if (!banner || !icon || !text || !btnText) return;

      if (!selectedGroup) {
        banner.className = "p-3 rounded-xl text-xs font-bold flex items-center justify-between transition-all bg-amber-50 text-amber-800 border border-amber-200";
        icon.innerText = "⚠️";
        text.innerText = "請先選擇隊伍 / 組別";
        btnText.innerText = "🚀 確認完成點名 ";
        return;
      }

      const savedStatus = localStorage.getItem(`attendance_submit_${currentDate}_${selectedGroup}`);
      const groupMembers = currentData.filter(row => (row[0] || '一般').trim() === selectedGroup);
      const sheetRecord = groupMembers.find(row => row[6] && row[8]);

      if (savedStatus || sheetRecord) {
        let timeStr = "";
        let updatedByStr = "";

        if (savedStatus) {
          const data = JSON.parse(savedStatus);
          timeStr = data.time;
          updatedByStr = data.updatedBy;
        } else if (sheetRecord) {
          updatedByStr = sheetRecord[7];
          timeStr = sheetRecord[8];
        }

        banner.className = "p-3 rounded-xl text-xs font-bold flex items-center justify-between transition-all bg-emerald-50 text-emerald-800 border border-emerald-300";
        icon.innerText = "✅";
        text.innerText = `【${selectedGroup}】(${currentDate}) 點名已成功提交 (${timeStr})`;
        btnText.innerText = "🔄 更新點名紀錄 (再次提交)";

        const updatedByInput = document.getElementById('updatedBy');
        if (updatedByStr && updatedByInput && !updatedByInput.value) {
          updatedByInput.value = updatedByStr;
        }
      } else {
        banner.className = "p-3 rounded-xl text-xs font-bold flex items-center justify-between transition-all bg-amber-50 text-amber-800 border border-amber-200";
        icon.innerText = "⚠️";
        text.innerText = `【${selectedGroup}】(${currentDate}) 點名：未完成提交`;
        btnText.innerText = "🚀 確認完成點名 ";
      }
    }

    async function loadAttendance() {
      const container = document.getElementById('memberList');
      const loading = document.getElementById('loading');
      const currentDate = getSelectedDate();

      if (loading) loading.classList.remove('hidden');
      if (container) container.innerHTML = '';
      log(`🔄 正在讀取 [${currentDate}] 的學生與點名資料...`);

      try {
        const response = await fetch(`${GAS_URL}?date=${currentDate}`);
        const result = await response.json();
        if (loading) loading.classList.add('hidden');

        if (result.success && result.data && result.data.length > 0) {
          currentData = result.data;
          log(`✅ 成功載入名單：共 ${currentData.length} 位學生！`);
          populateGroupDropdown();
          filterAndRenderList();
        } else {
          log("ℹ️ 系統尚無學生資料");
          const statsText = document.getElementById('statsText');
          if (statsText) statsText.innerText = "暫無名單數據";
          if (container) {
            container.innerHTML = `
              <div class="text-center py-8 text-slate-400">
                <p class="text-sm font-medium">系統暫無學生名單</p>
                <p class="text-xs mt-1">請點擊右上角「⚙️ 名單管理」匯入 CSV 名單。</p>
              </div>
            `;
          }
        }
      } catch (error) {
        if (loading) loading.classList.add('hidden');
        log("❌ 讀取資料失敗: " + error.message);
        if (container) {
          container.innerHTML = '<p class="text-center text-red-500 py-6 text-sm">⚠️ 讀取失敗，請確認 GAS 部署權限。</p>';
        }
      }
    }

    function populateGroupDropdown() {
      const groupSelect = document.getElementById('groupFilter');
      if (!groupSelect) return;

      const currentSelection = groupSelect.value;
      const groupCounts = {};

      currentData.forEach(row => {
        const g = (row[0] || '一般').trim();
        groupCounts[g] = (groupCounts[g] || 0) + 1;
      });

      const groupNames = Object.keys(groupCounts).sort();

      let optionsHTML = `<option value="">-- 👈 請先選擇隊伍 / 組別 --</option>`;
      groupNames.forEach(g => {
        optionsHTML += `<option value="${g}">🏃 ${g} (${groupCounts[g]}人)</option>`;
      });

      groupSelect.innerHTML = optionsHTML;

      if (currentSelection && groupCounts[currentSelection]) {
        groupSelect.value = currentSelection;
      } else {
        groupSelect.value = "";
      }
    }

    function filterAndRenderList() {
      const container = document.getElementById('memberList');
      const searchInput = document.getElementById('searchInput');
      const keyword = (searchInput ? searchInput.value : '').trim().toLowerCase();
      const groupFilter = document.getElementById('groupFilter');
      const selectedGroup = groupFilter ? groupFilter.value : '';

      if (!container) return;
      container.innerHTML = '';

      checkGroupSubmissionStatus(selectedGroup);

      if (!selectedGroup) {
        const statsText = document.getElementById('statsText');
        if (statsText) statsText.innerText = "請選擇隊伍";
        container.innerHTML = `
          <div class="text-center py-12 text-slate-400 border-2 border-dashed border-slate-200 rounded-2xl bg-slate-50/50">
            <p class="text-2xl mb-1">👈</p>
            <p class="text-sm font-bold text-slate-600">請先在上方選擇隊伍 / 組別</p>
            <p class="text-xs text-slate-400 mt-1">選擇隊伍後即可顯示成員名單進行點名</p>
          </div>
        `;
        return;
      }

      const groupMembers = currentData.filter(row => {
        const g = (row[0] || '一般').trim();
        return g === selectedGroup;
      });

      // 💡 預設每位學生為 ABS (缺席)，徹底取消未點名狀態
      groupMembers.forEach(row => {
        if (!row[6]) {
          row[6] = 'ABS';
        }
      });

      let presentCount = 0;
      let totalCount = groupMembers.length;

      groupMembers.forEach(row => {
        if (row[6] === 'Present') presentCount++;
      });

      const statsText = document.getElementById('statsText');
      if (statsText) statsText.innerText = `${selectedGroup} 出席：${presentCount} / ${totalCount} 人`;

      const filtered = groupMembers.filter(row => {
        const [group, className, classNo, gender, house, name] = row;
        const fullText = `${group||''} ${className||''} ${classNo||''} ${gender||''} ${house||''} ${name||''}`.toLowerCase();
        return fullText.includes(keyword);
      });

      if (filtered.length === 0) {
        container.innerHTML = '<p class="text-center text-slate-400 py-6 text-sm">找不到符合條件的學生</p>';
        return;
      }

      filtered.forEach((row) => {
        const [group, className, classNo, gender, house, name, status] = row;
        const isPresent = status === 'Present';
        const origIdx = currentData.findIndex(r => r[0]===group && r[1]===className && r[2]===classNo && r[5]===name);

        const card = document.createElement('div');
        card.className = `w-full p-3 rounded-xl border flex justify-between items-center transition-all cursor-pointer select-none active:scale-[0.98] ${
          isPresent
            ? 'bg-emerald-500 border-emerald-600 text-white shadow-md'
            : 'bg-rose-50 border-rose-200 text-rose-800'
        }`;

        card.innerHTML = `
          <div class="space-y-0.5">
            <div class="flex items-center gap-1.5 text-[11px]">
              <span class="${isPresent ? 'bg-emerald-700 text-white' : 'bg-rose-200 text-rose-800'} font-bold px-1.5 py-0.5 rounded">${group || '一般'}</span>
              <span class="${isPresent ? 'bg-emerald-600 text-white' : 'bg-rose-100 text-rose-700'} px-1.5 py-0.5 rounded font-medium">${className||''} ${classNo ? classNo + '號' : ''}</span>
              ${house ? `<span class="${isPresent ? 'bg-emerald-600 text-white' : 'bg-amber-100 text-amber-800'} px-1.5 py-0.5 rounded font-medium">${house}社</span>` : ''}
            </div>
            <div class="text-base font-bold pt-0.5">${name}</div>
          </div>
          <div class="text-xs font-bold px-3 py-1.5 rounded-full ${
            isPresent
              ? 'bg-emerald-800 text-white'
              : 'bg-rose-600 text-white'
          }">
            ${isPresent ? '✓ 出席' : '✗ 缺席'}
          </div>
        `;

        card.onclick = () => toggleAttendance(origIdx, isPresent ? 'ABS' : 'Present');
        container.appendChild(card);
      });
    }

    function toggleAttendance(index, newStatus) {
      if (!validateUpdatedBy()) return;

      if (index !== -1 && currentData[index]) {
        currentData[index][6] = newStatus;
        filterAndRenderList();
      }
    }

    async function markAllInGroup(newStatus) {
      const groupFilter = document.getElementById('groupFilter');
      const selectedGroup = groupFilter ? groupFilter.value : '';
      if (!selectedGroup) {
        alert("⚠️ 請先選擇隊伍 / 組別！");
        return;
      }

      if (!validateUpdatedBy()) return;

      const targetMembers = currentData.filter(row => (row[0] || '一般').trim() === selectedGroup);
      if (targetMembers.length === 0) return;
      const currentDate = getSelectedDate();

      if (newStatus === '') {
        if (!confirm(`⚠️ 確定要重置 [${currentDate}] 【${selectedGroup}】（共 ${targetMembers.length} 人）的點名狀態，並同步清空 Google Sheet 紀錄嗎？`)) return;

        log(`⏳ 正在同步清空 Google Sheet 上 [${currentDate}] 【${selectedGroup}】的點名紀錄...`);

        targetMembers.forEach(row => {
          row[6] = '';
          row[7] = '';
          row[8] = '';
        });

        localStorage.removeItem(`attendance_submit_${currentDate}_${selectedGroup}`);
        filterAndRenderList();

        const updatedBy = document.getElementById('updatedBy').value.trim();
        const recordsToSend = targetMembers.map(row => ({
          group: row[0], className: row[1], classNo: row[2],
          gender: row[3], house: row[4], name: row[5], status: ''
        }));

        try {
          const res = await fetch(GAS_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'submitAttendance',
              date: currentDate,
              updatedBy: updatedBy,
              records: recordsToSend
            })
          });

          const result = await res.json();
          if (result.success) {
            log(`🎉 已成功清空 Google Sheet 上 [${currentDate}] 【${selectedGroup}】的點名紀錄！`);
            alert(`✅ 已成功重置！\n\n【${selectedGroup}】(${currentDate}) 本地狀態及 Google Sheet 紀錄已同步清空。`);
          } else {
            alert("⚠️ 本地已重置，但 Google Sheet 清空失敗: " + result.message);
          }
        } catch (err) {
          log("❌ 清空 Google Sheet 失敗: " + err.message);
          alert("⚠️ 本地已重置，但發送至 Google Sheet 時發生網路錯誤。");
        }
        return;
      }

      let actionText = newStatus === 'ABS' ? "全不選 (缺席)" : "全選 (出席)";
      if (!confirm(`確定要將 [${currentDate}] 【${selectedGroup}】（共 ${targetMembers.length} 人）全部設為「${actionText}」嗎？`)) return;

      targetMembers.forEach(row => { row[6] = newStatus; });
      filterAndRenderList();
      log(`⚡ 已將 [${currentDate}] ${selectedGroup} 標示為：${actionText}`);
    }

    async function confirmAttendanceSubmission() {
      const updatedBy = validateUpdatedBy();
      if (!updatedBy) return;

      const groupFilter = document.getElementById('groupFilter');
      const selectedGroup = groupFilter ? groupFilter.value : '';
      if (!selectedGroup) {
        alert("⚠️ 請先選擇隊伍 / 組別！");
        return;
      }

      const currentDate = getSelectedDate();

      const markedMembers = currentData.filter(row => {
        const g = (row[0] || '一般').trim();
        const status = row[6];
        return g === selectedGroup && (status === 'Present' || status === 'ABS');
      });

      if (markedMembers.length === 0) {
        alert(`【${selectedGroup}】目前尚未點名任何學生！\n請先進行點名（或使用「全選」按鈕）再點擊提交。`);
        return;
      }

      const confirmBtn = document.getElementById('confirmBtn');
      if (confirmBtn) {
        confirmBtn.disabled = true;
        confirmBtn.classList.add('opacity-50');
      }
      log(`⏳ 正在上傳 [${currentDate}] 【${selectedGroup}】共 ${markedMembers.length} 筆點名紀錄至 Google Sheet...`);

      const recordsToSend = markedMembers.map(row => ({
        group: row[0], className: row[1], classNo: row[2],
        gender: row[3], house: row[4], name: row[5], status: row[6]
      }));

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'submitAttendance',
            date: currentDate,
            updatedBy: updatedBy,
            records: recordsToSend
          })
        });

        const result = await res.json();

        if (result.success) {
          const now = new Date();
          const timeStr = now.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

          localStorage.setItem(`attendance_submit_${currentDate}_${selectedGroup}`, JSON.stringify({
            date: currentDate, time: timeStr, updatedBy: updatedBy
          }));

          checkGroupSubmissionStatus(selectedGroup);
          log(`🎉 成功寫入 Google Sheet (${result.message})`);
          alert(`✅ 提交成功！\n\n已成功將 [${currentDate}] 【${selectedGroup}】(${markedMembers.length}人) 的點名紀錄寫入 Google Sheet！\n\n點名者：${updatedBy}\n提交時間：${timeStr}`);
        } else {
          alert("❌ Google Sheet 處理失敗: " + result.message);
        }
      } catch (err) {
        log("❌ 上傳失敗: " + err.message);
        alert("❌ 上傳失敗，請檢查網路連線。");
      } finally {
        if (confirmBtn) {
          confirmBtn.disabled = false;
          confirmBtn.classList.remove('opacity-50');
        }
      }
    }

    // 3. 開啟名單管理 Modal
    function openAdminModal() {
      const modal = document.getElementById('adminModal');
      const pwdArea = document.getElementById('pwdArea');
      const adminTools = document.getElementById('adminTools');
      const pwdInput = document.getElementById('adminPwd');

      if (modal) modal.classList.remove('hidden');
      if (pwdArea) pwdArea.classList.remove('hidden');
      if (adminTools) adminTools.classList.add('hidden');
      if (pwdInput) pwdInput.value = '';

      setTimeout(() => {
        if (pwdInput) pwdInput.focus();
      }, 100);
    }

    function closeAdminModal() {
      const modal = document.getElementById('adminModal');
      if (modal) modal.classList.add('hidden');
    }

    // 4. 🔒 密碼驗證 (連線至 GAS 後端即時驗證)
    async function checkPwd() {
      const pwdInput = document.getElementById('adminPwd');
      if (!pwdInput) return;

      const val = pwdInput.value.trim();
      if (!val) {
        alert("請輸入管理密碼！");
        return;
      }

      log("⏳ 正在向 Google 驗證管理密碼...");

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'verifyPassword',
            password: val
          })
        });

        const result = await res.json();

        if (result.success) {
          const pwdArea = document.getElementById('pwdArea');
          const adminTools = document.getElementById('adminTools');
          if (pwdArea) pwdArea.classList.add('hidden');
          if (adminTools) adminTools.classList.remove('hidden');
          log("✅ 密碼正確，開啟管理工具");
        } else {
          alert("❌ 密碼錯誤！請重新輸入。");
          pwdInput.value = '';
          pwdInput.focus();
          log("❌ 密碼驗證失敗");
        }
      } catch (err) {
        log("❌ 驗證連線失敗: " + err.message);
        alert("❌ 驗證失敗，請檢查網絡連線或 GAS 部署。");
      }
    }

    // 5. 📥 CSV 範本（學校格式，內容為虛構資料）
    function downloadCSVTemplate() {
      const csvContent = "\uFEFF" + [
        "年度,Category,Group,登入名稱,班別,班號,性別,社,Level,姓名",
        "2026-2027,校隊,單車隊,demo0001,2A,7,M,信,中二,陳大文",
        "2026-2027,校隊,單車隊,demo0002,3B,12,F,望,中三,李小花",
        "2026-2027,校隊,單車隊,demo0003,1C,3,M,愛,中一,張小明"
      ].join("\n");
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "點名名單範本.csv";
      a.click();
      URL.revokeObjectURL(url);
      log("✅ 範本已下載（學校格式）");
    }

    // 6. CSV 解析（支援引號內逗號、BOM、Windows / Mac 換行）
    function parseCSV(text) {
      text = text.replace(/^\uFEFF/, '');
      const rows = [];
      let row = [], cell = '', inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQuotes) {
          if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
          else if (c === '"') inQuotes = false;
          else cell += c;
        } else if (c === '"') inQuotes = true;
        else if (c === ',') { row.push(cell); cell = ''; }
        else if (c === '\n' || c === '\r') {
          if (c === '\r' && text[i + 1] === '\n') i++;
          row.push(cell); cell = '';
          if (row.some(x => x.trim() !== '')) rows.push(row);
          row = [];
        } else cell += c;
      }
      row.push(cell);
      if (row.some(x => x.trim() !== '')) rows.push(row);
      return rows;
    }

    async function uploadCSVFile() {
      const fileInput = document.getElementById('csvFile');
      const uploadBtn = document.getElementById('uploadBtn');
      const pwdInput = document.getElementById('adminPwd');
      const adminPwd = pwdInput ? pwdInput.value.trim() : '';

      if (!adminPwd) {
        alert("⚠️ 請先輸入管理密碼！");
        return;
      }

      if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
        alert("請先點擊「選擇檔案」選擇 CSV 檔！");
        return;
      }

      const file = fileInput.files[0];
      log(`📄 準備上傳檔案: ${file.name}`);

      if (uploadBtn) {
        uploadBtn.disabled = true;
        uploadBtn.innerText = "⏳ 正在傳送至 Google...";
        uploadBtn.classList.add("opacity-50");
      }

      const reader = new FileReader();

      reader.onload = async function(e) {
        try {
          const rows = parseCSV(e.target.result);
          if (rows.length < 2) throw new Error("CSV 內容為空或只有標題列");

          // 按標題名稱找欄位位置（兼容學校格式，欄位次序改變都唔怕）
          const header = rows[0].map(h => h.trim().toLowerCase());
          const col = {
            group: header.indexOf('group'),
            className: header.indexOf('班別'),
            classNo: header.indexOf('班號'),
            gender: header.indexOf('性別'),
            house: header.indexOf('社'),
            name: header.indexOf('姓名')
          };
          const missing = Object.entries(col).filter(([k, v]) => v === -1).map(([k]) => k);
          if (missing.length) {
            throw new Error("CSV 缺少欄位：" + missing.join(', ') + "\n請使用學校格式（Group、班別、班號、性別、社、姓名）");
          }

          const members = [];
          for (let i = 1; i < rows.length; i++) {
            const r = rows[i];
            const name = (r[col.name] || '').trim();
            if (!name) continue; // 無姓名嘅行略過
            members.push({
              group: (r[col.group] || '').trim(),
              className: (r[col.className] || '').trim(),
              classNo: (r[col.classNo] || '').trim(),
              gender: (r[col.gender] || '').trim(),
              house: (r[col.house] || '').trim(),
              name: name
            });
          }

          log(`📊 CSV 解析成功：共 ${members.length} 筆資料，傳送中...`);

          const res = await fetch(GAS_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'batchUploadMembers',
              password: adminPwd,
              members: members
            })
          });

          const responseText = await res.text();
          let result;

          try {
            result = JSON.parse(responseText);
          } catch (parseError) {
            log("❌ Google 回傳格式錯誤！");
            return;
          }

          if (result.success) {
            log("🎉 匯入成功！更新名單庫...");
            closeAdminModal();
            await loadAttendance();
            alert("✅ 上傳成功！\n\n" + (result.message || "學生名單庫已更新。"));
          } else {
            log(`❌ 處理失敗：${result.message || '未知錯誤'}`);
            alert("❌ 上傳失敗：\n\n" + (result.message || "未知錯誤"));
          }

        } catch (err) {
          log("❌ 傳送失敗: " + err.message);
          alert("❌ 上傳失敗：\n\n" + err.message);
        } finally {
          if (uploadBtn) {
            uploadBtn.disabled = false;
            uploadBtn.innerText = "🚀 開始上傳匯入";
            uploadBtn.classList.remove("opacity-50");
          }
        }
      };

      reader.readAsText(file, 'UTF-8');
    }

    // ============================================================
    // 📊 歷史紀錄與出席率 Modal 控制邏輯
    // ============================================================
    let histTimer = null;

    async function openHistoryModal() {
      document.getElementById('historyModal').classList.remove('hidden');

      // 沿用主畫面隊伍選單內容
      const groupSelect = document.getElementById('groupFilter');
      const histGroup = document.getElementById('histGroup');
      if (histGroup) {
        histGroup.innerHTML = '<option value="">全部組別</option>';
        if (groupSelect && groupSelect.options.length > 0) {
          Array.from(groupSelect.options).forEach(opt => {
            if (opt.value) {
              histGroup.innerHTML += `<option value="${opt.value}">${opt.value}</option>`;
            }
          });
        }
      }

      await fetchHistory(true);
    }

    function closeHistoryModal() {
      document.getElementById('historyModal').classList.add('hidden');
    }

    function fetchHistory(isFirstLoad = false) {
      clearTimeout(histTimer);
      histTimer = setTimeout(async () => {
        const histGroup = document.getElementById('histGroup');
        const group = histGroup ? histGroup.value : '';
        const name = document.getElementById('histSearch').value.trim();
        const loading = document.getElementById('histLoading');
        const container = document.getElementById('histList');

        if (!loading || !container) return;

        loading.classList.remove('hidden');
        container.innerHTML = '';

        try {
          const res = await fetch(GAS_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'getAttendanceHistory',
              group: group,
              name: name
            })
          });

          const data = JSON.parse(await res.text());

          if (data.success) {
            const stats = data.stats || {};

            // 1. 更新統計卡片 (總點名人次、出席率、缺席)
            document.getElementById('statTotal').innerText = stats.total || 0;
            document.getElementById('statRate').innerText = (stats.rate !== undefined ? stats.rate : 0) + '%';
            document.getElementById('statAbsent').innerText = stats.absent || 0;

            // 2. 若隊伍選單為空，由紀錄自動補上
            if (isFirstLoad === true && histGroup && histGroup.options.length <= 1 && data.logs) {
              const uniqueGroups = [...new Set(data.logs.map(l => l.group).filter(Boolean))];
              uniqueGroups.forEach(grpName => {
                const opt = document.createElement('option');
                opt.value = grpName;
                opt.textContent = grpName;
                histGroup.appendChild(opt);
              });
            }

            // 3. 渲染列表 (出席 / 缺席)
            if (!data.logs || data.logs.length === 0) {
              container.innerHTML = '<div class="text-center text-slate-400 py-6">查無相關點名紀錄</div>';
            } else {
              container.innerHTML = data.logs.map(item => {
                const sLower = (item.status || '').toLowerCase().trim();

                let statusBadge = `<span class="px-2 py-0.5 rounded text-xs bg-slate-100 text-slate-600 font-medium">${item.status || '未知'}</span>`;

                if (sLower === 'present' || sLower === '出席') {
                  statusBadge = '<span class="px-2 py-0.5 rounded text-xs bg-emerald-100 text-emerald-800 font-medium">Present</span>';
                } else if (sLower === 'abs' || sLower === 'absent' || sLower === '缺席' || sLower.includes('缺')) {
                  statusBadge = '<span class="px-2 py-0.5 rounded text-xs bg-rose-100 text-rose-800 font-medium">缺席</span>';
                }

                return `
                  <div class="flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-100 text-sm">
                    <div class="flex items-center gap-3">
                      <div class="text-xs text-slate-400 font-mono w-24">${item.date}</div>
                      <div>
                        <span class="font-bold text-slate-700">${item.name}</span>
                        <span class="text-xs text-slate-400 ml-1">(${item.className} ${item.classNo})</span>
                        <span class="text-xs bg-slate-200 text-slate-600 px-1.5 py-0.5 rounded ml-2">${item.group}</span>
                      </div>
                    </div>
                    <div class="flex items-center gap-2">
                      <span class="text-xs text-slate-400">點名者: ${item.updatedBy}</span>
                      ${statusBadge}
                    </div>
                  </div>
                `;
              }).join('');
            }
          } else {
            container.innerHTML = `<div class="text-center text-rose-500 py-4">載入失敗：${data.message || '未知錯誤'}</div>`;
          }
        } catch (err) {
          container.innerHTML = `<div class="text-center text-rose-500 py-4">載入歷史紀錄失敗：${err.message}</div>`;
        } finally {
          loading.classList.add('hidden');
        }
      }, 300);
    }
